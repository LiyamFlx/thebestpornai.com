name: Deploy to Production

# Vercel's GitHub integration has intermittently left pushes to main as
# preview-only deployments instead of auto-promoting to production, requiring
# a manual `vercel promote` every time. This workflow removes that manual
# step: it builds and deploys straight to production via the Vercel CLI
# (which blocks until the deployment + domain aliasing is complete), then
# verifies thebestpornai.com is actually serving the commit that was just
# pushed before declaring success.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production (blocks until live + aliased)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify thebestpornai.com is serving this commit
        run: |
          expected="${{ github.sha }}"
          echo "Waiting for thebestpornai.com to report commit $expected..."
          for i in $(seq 1 12); do
            served=$(curl -fsS "https://thebestpornai.com/api/version" 2>/dev/null | jq -r '.sha // empty')
            if [ "$served" = "$expected" ]; then
              echo "Confirmed: thebestpornai.com is serving $expected"
              exit 0
            fi
            echo "  attempt $i: got '${served:-<none>}', retrying in 10s..."
            sleep 10
          done
          echo "::error::thebestpornai.com is NOT serving commit $expected after 2 minutes (last seen: '${served:-<none>}'). Deployment call reported success (${{ steps.deploy.outputs.deployment_url }}) but the live domain didn't update — investigate the Vercel project's Git integration / production alias."
          exit 1
