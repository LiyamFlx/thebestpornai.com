name: Deploy to Production

# Vercel's GitHub integration has intermittently left pushes to main as
# preview-only deployments instead of auto-promoting to production, requiring
# a manual `vercel promote` every time. This workflow removes that manual
# step: it builds and deploys straight to production via the Vercel CLI
# (which blocks until the deployment + domain aliasing is complete), then
# verifies thebestpornai.com is actually serving the commit that was just
# pushed before declaring success.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows a manual re-run from the Actions tab without an empty commit

concurrency:
  group: deploy-production
  # Queue rather than cancel: an in-flight deploy is mid-build/mid-alias by
  # the time a second push arrives, and cancelling it there can leave Vercel
  # in a partial state. Runs execute strictly in queue order instead, so a
  # newer push's deploy always lands after (and overwrites) an older one.
  cancel-in-progress: false

env:
  # .vercel/project.json (which pins this checkout to the correct existing
  # project) is gitignored, so a fresh CI checkout has no way to know which
  # project to deploy to on its own. Without these, `vercel pull` silently
  # created a brand-new, separate project instead of linking to this one —
  # a real incident on the first run of this workflow: CI deployed
  # successfully, just to a project that didn't own thebestpornai.com, so
  # the domain never updated. These IDs are not secret (they're already
  # committed in .vercel/project.json on any dev machine that's run `vercel
  # link` here) but are passed as repo variables rather than hardcoded so
  # they're one visible place to update if the project is ever recreated.
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: rm -rf .vercel && vercel link --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production (blocks until live + aliased)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --archive=tgz --token="${{ secrets.VERCEL_TOKEN }}")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify www.thebestpornai.com is serving this commit
        # Checked against www, not the bare apex domain: as of 2026-07-22 the
        # apex (thebestpornai.com with no www) is on a DNS A-record pointing
        # at a third-party forwarding service, not Vercel's edge network —
        # it 301-redirects "/" to www but 404s on every other path,
        # including this one. That's a DNS/registrar fix, not something a
        # deploy workflow can verify around. www resolves correctly to
        # Vercel (CNAME to vercel-dns) and is the reliable check until the
        # apex DNS is corrected — see the Vercel project's Domains settings.
        run: |
          expected="${{ github.sha }}"
          echo "Waiting for www.thebestpornai.com to report commit $expected..."
          for i in $(seq 1 12); do
            served=$(curl -fsS "https://www.thebestpornai.com/api/version" 2>/dev/null | jq -r '.sha // empty')
            if [ "$served" = "$expected" ]; then
              echo "Confirmed: www.thebestpornai.com is serving $expected"
              exit 0
            fi
            echo "  attempt $i: got '${served:-<none>}', retrying in 10s..."
            sleep 10
          done
          echo "::error::www.thebestpornai.com is NOT serving commit $expected after 2 minutes (last seen: '${served:-<none>}'). Deployment call reported success (${{ steps.deploy.outputs.deployment_url }}) but the live domain didn't update — investigate the Vercel project's Git integration / production alias."
          exit 1
