<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StreamHub — Watch</title>
<meta name="description" content="StreamHub — stream originals and community videos. Browse, search, favorite, and build playlists."/>
<meta name="theme-color" content="#E50914"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E50914'/%3E%3C/svg%3E"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="StreamHub"/>
<meta property="og:title" content="StreamHub"/>
<meta property="og:description" content="Stream originals and community videos."/>
<meta name="twitter:card" content="summary"/>
<style>:root{
  --bg:#0A0A0A;
  --surface:#141414;
  --surface2:#1E1E1E;
  --surface3:#262626;
  --text:#FFFFFF;
  --muted:#A0A0A0;
  --accent:#E50914;
  --accent2:#FF3B3B;
  --good:#FF5252;
  --warn:#FFB020;
  --danger:#FF1A1A;
  --border:rgba(255,255,255,0.10);
  --shadow:0 20px 60px rgba(0,0,0,0.6);
  --radius:14px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}

/* Layout */
.app{display:flex;height:100vh}
.sidebar{
  width:240px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow:auto;
}
.brand{
  font-weight:800;
  letter-spacing:0.5px;
  font-size:15px;
  color:var(--accent);
  padding:6px 10px 14px;
  display:flex;align-items:center;gap:8px;
}
.brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent)}
.nav-label{
  font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin:12px 10px 4px;
}
.nav button{
  width:100%;
  background:transparent;border:none;
  color:var(--muted);
  padding:9px 10px;border-radius:8px;
  text-align:left;cursor:pointer;
  font-size:13px;transition:.15s;
  display:flex;align-items:center;gap:9px;
}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:rgba(229,9,20,0.15);color:#fff;font-weight:600}
.nav button .ico{width:16px;text-align:center;opacity:.9}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  min-height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px;border-bottom:1px solid var(--border);
  background:rgba(20,20,20,0.7);backdrop-filter:blur(10px);
  gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;
}
.topbar .left{display:flex;align-items:center;gap:14px;font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.search-input{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:999px;font-size:13px;width:240px;outline:none;
}
.search-input:focus{border-color:var(--accent)}
.icon-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12px;transition:.2s;
}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.on{border-color:var(--accent2);background:rgba(255,59,59,0.15)}
.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),#7A0008);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
}

.content{padding:24px;overflow:auto;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

h1{font-size:24px;margin:0 0 4px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 10px}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.small{font-size:11px;color:var(--muted)}

/* Cards / grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.row-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.row-scroll .card{min-width:220px}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;cursor:pointer;transition:all .22s ease;
}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card:active{transform:scale(.985)}

.video-thumb{
  position:relative;height:124px;border-radius:10px;overflow:hidden;margin-bottom:10px;
  background:linear-gradient(135deg,var(--accent),#7A0008);
}
.video-thumb.original{background:linear-gradient(135deg,#7A0008,#E50914)}
.thumb-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play-badge{
  position:absolute;bottom:8px;right:8px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);border-radius:50%;font-size:11px;color:#fff;backdrop-filter:blur(4px);
}
.dur-badge{
  position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);
  padding:1px 6px;border-radius:6px;font-size:10px;
}
.title{font-size:13px;font-weight:600}
.meta{font-size:11px;color:var(--muted);margin-top:2px}

.card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font-size:11px;padding:4px 9px;border-radius:999px;cursor:pointer;transition:.2s;
}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent2);color:var(--accent2)}
.chip.score{cursor:default;color:var(--accent2);border-color:transparent;background:rgba(229,9,20,0.10)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.panel h3{margin-top:0}
.panel pre{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:12px;overflow:auto;font-size:12px;color:var(--muted);line-height:1.7;
}

/* Metric cards */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:8px}
.metric{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;
}
.metric .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.metric .value{font-size:26px;font-weight:800;margin-top:6px}
.metric .delta{font-size:11px;margin-top:4px}
.metric .delta.up{color:var(--good)}
.metric .delta.down{color:var(--muted)}

/* Hero */
.hero{
  position:relative;height:300px;border-radius:18px;overflow:hidden;margin-bottom:24px;
  display:flex;align-items:flex-end;
  background:linear-gradient(135deg,#2A0307,#0A0A0A);
  border:1px solid var(--border);
}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.hero .hero-body{position:relative;padding:28px;max-width:560px;
  background:linear-gradient(90deg,rgba(10,10,10,.9),transparent)}
.hero h1{font-size:30px}
.hero .tag{display:inline-block;background:var(--accent);color:#fff;font-size:10px;
  padding:3px 8px;border-radius:6px;letter-spacing:1px;margin-bottom:10px}

/* Buttons */
.btn{
  background:var(--accent);border:none;color:#fff;padding:10px 18px;border-radius:10px;
  cursor:pointer;font-size:13px;font-weight:600;transition:.2s;margin-right:6px;
}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500}
.btn.sm{padding:7px 12px;font-size:12px}

/* Inputs */
input.fld, textarea.fld, select.fld{
  width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:10px;outline:none;font-family:inherit;font-size:13px;
}
input.fld:focus,textarea.fld:focus,select.fld:focus{border-color:var(--accent)}
textarea.fld{min-height:90px;resize:vertical}
label.lbl{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}

/* Tables */
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{
  text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;padding:10px 12px;border-bottom:1px solid var(--border);
}
table.data td{padding:11px 12px;border-bottom:1px solid var(--border)}
table.data tr:hover td{background:var(--surface2)}
.tag-pill{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--border)}
.tag-pill.green{color:var(--good);border-color:rgba(255,82,82,.4)}
.tag-pill.warn{color:var(--warn);border-color:rgba(255,176,32,.4)}
.tag-pill.red{color:var(--accent2);border-color:rgba(255,59,59,.4)}
.tag-pill.muted{color:var(--muted)}

/* Bar chart (pure CSS) */
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bars .bar{flex:1;background:linear-gradient(180deg,var(--accent),#7A0008);
  border-radius:6px 6px 0 0;min-height:4px;position:relative;transition:.3s}
.bars .bar:hover{filter:brightness(1.2)}
.bars .bar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.bars-x{display:flex;gap:8px;margin-top:6px}
.bars-x div{flex:1;text-align:center;font-size:10px;color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{
  background:transparent;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;
  font-size:13px;border-bottom:2px solid transparent;
}
.tabs button.active{color:#fff;border-bottom-color:var(--accent)}

/* Stepper */
.steps{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.steps .dot{height:5px;flex:1;min-width:24px;border-radius:999px;background:var(--surface3)}
.steps .dot.active{background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* Upload wizard footer — Back left, primary action bottom-right */
.wizard-footer{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);
}
.wizard-footer .btn{margin-right:0}

/* Creator onboarding */
.onboard{max-width:920px;margin:0 auto;padding-top:10px}
.onboard h1{font-size:28px}
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
@media(max-width:820px){.plan-grid{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;position:relative;display:flex;flex-direction:column}
.plan.best{border-color:var(--accent);box-shadow:0 14px 40px rgba(229,9,20,.18)}
.plan-badge{position:absolute;top:-10px;left:22px;background:var(--accent);color:#fff;font-size:10px;
  font-weight:700;letter-spacing:.5px;padding:3px 10px;border-radius:999px}
.plan h3{margin:0 0 6px;font-size:18px}
.plan-price{font-size:26px;font-weight:800;margin-bottom:4px}
.plan-feats{list-style:none;padding:0;margin:14px 0 18px;font-size:13px;color:var(--muted);flex:1}
.plan-feats li{padding:4px 0}
.onboard-form{max-width:620px}

/* Tag picker */
.tag-picker{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tag-chip{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s;
}
.tag-chip:hover{border-color:var(--accent)}
.tag-chip.on{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}

/* Searchable multi-select (Category / Created using / Tags) */
.ms-box{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:7px 10px;min-height:42px;cursor:text;margin-top:4px;
}
.ms-box:focus-within{border-color:var(--accent)}
.ms-token{
  display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
  font-size:12px;font-weight:600;padding:3px 6px 3px 10px;border-radius:999px;
}
.ms-token button{background:transparent;border:none;color:#fff;cursor:pointer;font-size:14px;line-height:1;padding:0}
.ms-input{flex:1;min-width:120px;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;font-family:inherit}
.ms-list{
  display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;max-height:150px;overflow:auto;
}
.ms-opt{
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.15s;
}
.ms-opt:hover{border-color:var(--accent);color:var(--text)}
.ms-empty{font-size:12px;color:var(--muted);padding:6px}

/* Watch layout */
.watch{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media(max-width:900px){.watch{grid-template-columns:1fr}}

/* ===== Watch page — redesigned ===== */
.watch-title{margin:16px 0 6px;font-size:26px;font-weight:800}
.watch-sub{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;margin:0 0 18px}
.watch-sub .ic-eye{opacity:.8}
.dot-sep{opacity:.5}

/* action row */
.watch-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.vote-pill{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:999px;overflow:hidden}
.vote-btn{display:flex;align-items:center;gap:7px;background:none;border:none;color:var(--text);
  padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.vote-btn:hover{background:var(--surface3)}
.vote-btn .ic{filter:saturate(1.4)}
.vote-div{width:1px;align-self:stretch;background:var(--border)}
.act-btn{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.act-btn:hover{background:var(--surface3);border-color:var(--muted)}
.act-btn.on{color:var(--accent2);border-color:var(--accent2)}
.act-btn .ic{font-size:15px}
.act-more{padding:10px 16px;letter-spacing:1px}

/* creator card with subtle red glow */
.creator-card{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-bottom:18px;
  border:1px solid var(--border);border-radius:16px;
  background:radial-gradient(120% 180% at 100% 50%, rgba(229,9,20,.10), var(--surface) 60%)}
.avatar-lg{width:50px;height:50px;font-size:19px;flex:none}
.avatar-sm{width:34px;height:34px;font-size:13px;flex:none}
.creator-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.verified{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  background:var(--muted);color:var(--bg);font-size:10px;font-weight:900}
.subscribe-btn{display:flex;align-items:center;gap:7px;padding:11px 22px;border-radius:999px;font-size:14px}

/* comments card */
.comments-card{border:1px solid var(--border);border-radius:16px;padding:20px;background:var(--surface);margin-bottom:24px}
.comments-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.comments-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.count-bubble{background:var(--surface3);color:var(--muted);font-size:12px;font-weight:700;
  min-width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.sort-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer;outline:none}
.comment-form{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.comment-form .fld{flex:1;border-radius:12px}
.comment-form .btn{flex:none;white-space:nowrap;border-radius:12px}
.comment-list{margin-top:6px}
.comment-list .comment{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--border)}
.comment-list .comment:first-child{border-top:none}
.comment-text{font-size:14px;margin-top:3px;line-height:1.5}
.comments-empty{text-align:center;padding:30px 10px}
.ce-icon{font-size:30px;margin-bottom:8px;opacity:.85}
.ce-title{font-weight:700;margin-bottom:3px}

/* related-below: only shown when the sidebar is hidden (mobile) */
.related-below{display:none}
.related-below h3{margin:8px 0 12px}

/* Mobile bottom tab bar — hidden on desktop, shown under 760px */
.bottom-nav{display:none}
@media(max-width:760px){
  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(20,20,20,0.96);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);
    padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav button{
    flex:1;background:none;border:none;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
    min-height:48px;padding:4px 0;font-size:10px;cursor:pointer;
  }
  .bottom-nav button .ico{font-size:19px;line-height:1}
  .bottom-nav button.active{color:#fff}
}

/* ---- Mobile layout (≤760px) ---- */
@media(max-width:760px){
  .app{flex-direction:column;height:auto;min-height:100vh}
  .sidebar{display:none}
  .main{min-height:100vh}
  .content{padding:14px;padding-bottom:84px}   /* clear the bottom nav */

  /* Watch: drop the side column, show Related below instead */
  .watch-side{display:none}
  .related-below{display:block}
  .watch-title{font-size:21px}
  .watch-actions{gap:8px}
  .act-btn,.vote-btn{padding:9px 13px;font-size:13px}
  .creator-card{padding:13px}
  .comments-card{padding:14px}
  .comments-title{font-size:16px}

  .topbar{padding:10px 14px;gap:8px}
  .topbar .left{font-size:16px}
  .topbar-actions{flex:1;justify-content:flex-end}
  .search-input{width:100%;flex:1;min-width:0;font-size:16px} /* 16px avoids iOS zoom */
  .topbar-actions .icon-btn{display:none}      /* declutter; Search/Later live in bottom nav */

  /* Comfortable 2-up grid instead of one giant column */
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .grid .card,.row-scroll .card{padding:8px}
  .row-scroll .card{min-width:150px}
  .video-thumb{height:96px}
  .title{font-size:12px}
  .card:hover{transform:none}                  /* no hover-lift on touch */

  /* Hero scaled down */
  .hero{height:200px;border-radius:14px;margin-bottom:18px}
  .hero .hero-body{padding:18px;max-width:100%}
  .hero h1{font-size:21px}

  h1{font-size:20px}h2{font-size:18px}

  /* Watch page tweaks */
  .player{height:auto;aspect-ratio:16/9}
  .modal{width:94vw;max-height:88vh}

  /* Bigger tap targets */
  .btn{padding:11px 18px}
  .chip{padding:7px 12px;font-size:12px}
}
.player{
  width:100%;height:380px;border-radius:14px;background:#000;border:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:#555;
}
video.player{object-fit:contain}
iframe.player{display:block}

/* Loader */
.loader{width:100%;height:6px;background:var(--surface3);border-radius:999px;overflow:hidden;margin-top:10px}
.loader::after{content:"";display:block;width:40%;height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));animation:load 1.2s infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--accent);
  padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;
  opacity:0;transform:translateY(10px);transition:.3s;z-index:80;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}

/* Badge */
.badge{background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px;font-size:10px;margin-left:4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;
  justify-content:center;z-index:90}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:22px;width:440px;max-width:92vw;box-shadow:var(--shadow)}

/* Empty / skeleton */
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-pill{background:var(--surface2);border:1px solid var(--border);color:var(--text);

<!-- Catalog: single source of truth, loaded at runtime (see /catalog.js) -->
<script src="../catalog.js?v=3"></script>
<!-- Persistence API: real likes/comments/favorites via Supabase (graceful fallback) -->
<script src="../streamhub-api.js?v=3"></script>
<script>
/* creatorName(), fmt(), toast() are shared — defined in catalog.js */
function ytId(url){ if(!url) return null; const m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }

function playerEmbed(v){
  const yt = ytId(v.src);
  if(yt) return `<iframe class="player" src="https://www.youtube.com/embed/${yt}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  if(v.src) return `<video class="player" src="${mediaUrl(v.src)}" controls></video>`;
  return `<div class="player">VIDEO STREAM — ${esc(v.title)}</div>`;
}

function videoCard(v, opts={}){
  const thumb = v.thumb
    ? `<img class="thumb-video" src="${v.thumb}" alt=""/>`
    : (v.src && !ytId(v.src)
        ? `<video class="thumb-video lazy" data-src="${mediaUrl(v.src)}#t=0.1" muted preload="none" playsinline></video>` : ``);
  return `
    <div class="card" onclick="${opts.onClick || `openVideo(${v.id})`}">
      <div class="video-thumb ${v.type==='original'?'original':''}">
        ${thumb}
        ${v.duration?`<span class="dur-badge">${esc(v.duration)}</span>`:``}
        ${v.src?`<span class="play-badge">▶</span>`:``}
      </div>
      <div class="title">${esc(v.title)}</div>
      <div class="meta">${esc(creatorName(v.creator))} • ${fmt(v.views)} views</div>
      ${opts.extra ? opts.extra(v) : ``}
    </div>`;
}

/* toast() is shared — defined in catalog.js */

</script>
<script>
/* ===================== VIEWER APP ===================== */
let vstate = {
  page:"home", current:null,
  favorites:[], later:[], history:[], downloads:[],
  subs:["c1","c2"],
};

function go(p){ vstate.page=p; setHash(p==="home"?"":p); render(); }
function focusSearch(){
  const i=document.getElementById("searchInput");
  if(i){ i.scrollIntoView({block:"start",behavior:"smooth"}); i.focus(); }
}
function openVideo(id){
  vstate.current = DATA.videos.find(v=>v.id===id);
  if(!vstate.current) return;
  if(!vstate.history.includes(id)) vstate.history.unshift(id);
  vstate.page="watch"; setHash("video/"+id); render();
  hydrateWatch(id);   // fetch real counts/comments and patch them in (non-blocking)
}

/* Pull persisted likes/comments from Supabase and patch the already-rendered
   watch page. Best-effort: any failure leaves the seeded values in place.
   Also records the view here so it fires on BOTH the click path (openVideo) and
   the direct-link/refresh path (applyHash -> render -> pending hydrate). */
async function hydrateWatch(id){
  if(typeof ShAPI==="undefined" || !ShAPI.enabled) return;
  _persist(()=> ShAPI.addView(id));   // record a real view (fire-and-forget)
  try {
    const [counts, comments, views, favCount] = await Promise.all([
      ShAPI.likeCounts(id), ShAPI.listComments(id), ShAPI.viewCount(id), ShAPI.favoriteCount(id)
    ]);
    if(vstate.current && vstate.current.id===id && onWatch()){
      const v = vstate.current;
      // Show seeded baseline + real persisted events, so counts are realistic AND grow.
      const likeNum=document.getElementById("likeNum"), disNum=document.getElementById("disNum");
      if(likeNum) likeNum.textContent = fmt(v.likes + (counts.like||0));
      if(disNum)  disNum.textContent  = fmt(v.dislikes + (counts.dislike||0));
      // Views (seed + real) in the sub line.
      const subEl=document.getElementById("watchSub");
      if(subEl) subEl.innerHTML = "👁 " + fmt(v.views + (views||0)) + " views <span class='dot-sep'>•</span> " + esc(v.uploaded);
      // Favorites count chip.
      const favCountEl=document.getElementById("favCount");
      if(favCountEl) favCountEl.textContent = favCount ? (" ("+fmt(favCount)+")") : "";
      if(comments && comments.length){
        // Merge persisted comments into DATA.comments (avoid dupes) and re-render the list region.
        for(const c of comments){
          const key = "db"+c.id;
          if(!DATA.comments.some(m=>m.id===key))
            DATA.comments.push({ id:key, video:id, user:c.author, text:c.body, time:"" });
        }
        if(vstate.current && vstate.current.id===id && onWatch()) render();
      }
    }
  } catch(_){ /* offline / API down -> keep seeded values */ }
}
/* ---- URL hash routing: shareable/bookmarkable per-video URLs ---- */
let _suppressHash=false;
let _pendingHydrate=null;   // video id to hydrate after the next render (direct-link/refresh path)
function setHash(h){ _suppressHash=true; location.hash = h?("#"+h):""; setTimeout(()=>_suppressHash=false,0); }
function applyHash(){
  const h=(location.hash||"").replace(/^#/,"");
  const m=h.match(/^video\/(\d+)$/);
  if(m){
    const vid=DATA.videos.find(v=>v.id===+m[1]);
    if(vid){ vstate.current=vid; if(!vstate.history.includes(vid.id)) vstate.history.unshift(vid.id); vstate.page="watch"; _pendingHydrate=vid.id; return; }
  }
  vstate.page = h || "home";
}
window.addEventListener("hashchange",()=>{ if(_suppressHash) return; applyHash(); render(); });
/* These actions update one on-screen control. When we're on the watch page we
   patch just that button — a full render() would rebuild #view (player + layout)
   and reset the scroll position, causing a visible "jump". We only fall back to
   render() when the relevant button isn't on screen (e.g. favoriting from a grid
   card), so list pages that depend on the state still refresh. */
function onWatch(){ return vstate.page==="watch"; }

/* Fire-and-forget persistence: never let an API failure break the UI. The
   optimistic in-memory update has already been applied by the caller, so if
   Supabase is down we simply keep that (today's fallback behavior). */
function _persist(promiseFn){
  try { if(typeof ShAPI!=="undefined" && ShAPI.enabled) Promise.resolve(promiseFn()).catch(()=>{}); } catch(_){}
}

function toggleFav(id){
  const on = vstate.favorites.includes(id);
  on ? vstate.favorites=vstate.favorites.filter(x=>x!==id) : vstate.favorites.push(id);
  toast(!on?"Added to Favorites":"Removed from Favorites");
  _persist(()=> on ? ShAPI.removeFavorite(id) : ShAPI.addFavorite(id));
  const btn=document.getElementById("btnFav");
  if(onWatch() && btn) btn.classList.toggle("on", !on); else render();
}
function toggleLater(id){
  const on = vstate.later.includes(id);
  on ? vstate.later=vstate.later.filter(x=>x!==id) : vstate.later.push(id);
  toast(!on?"Saved to Watch Later":"Removed");
  const btn=document.getElementById("btnLater");
  if(onWatch() && btn) btn.classList.toggle("on", !on); else render();
}
function download(id){ if(!vstate.downloads.includes(id))vstate.downloads.push(id); toast("Download started (simulated)"); }
function likeVideo(id){
  const v=DATA.videos.find(x=>x.id===id); if(!v)return; v.likes++; toast("Liked");
  _persist(()=> ShAPI.addLike(id,"like"));
  const num=document.getElementById("likeNum");
  if(onWatch() && num) num.textContent=fmt(v.likes); else render();
}
function dislikeVideo(id){
  const v=DATA.videos.find(x=>x.id===id); if(!v)return; v.dislikes++; toast("Disliked");
  _persist(()=> ShAPI.addLike(id,"dislike"));
  const num=document.getElementById("disNum");
  if(onWatch() && num) num.textContent=fmt(v.dislikes); else render();
}
function subscribe(cid){ vstate.subs.includes(cid)?vstate.subs=vstate.subs.filter(x=>x!==cid):vstate.subs.push(cid); render(); }
function addComment(id){
  const box=document.getElementById("cbox"); const t=(box.value||"").trim(); if(!t)return;
  DATA.comments.push({id:"m"+Date.now(),video:id,user:DATA.user.name,text:t,time:"now"});
  _persist(()=> ShAPI.addComment(id, DATA.user.name, t));
  render();
}

const trending = ()=> [...DATA.videos].sort((a,b)=> (b.likes*1.2+b.views*0.01) - (a.likes*1.2+a.views*0.01));
const byCat = (c)=> DATA.videos.filter(v=>v.category===c);

function rowSection(title, list){
  if(!list.length) return "";
  return `<h3>${title}</h3><div class="row-scroll">${list.map(v=>videoCard(v)).join("")}</div>`;
}

function renderHome(){
  const hero = DATA.videos.find(v=>v.type==="original") || DATA.videos[0];
  if(!hero) return `<div class="empty">No videos available yet.</div>`;
  const top = trending();   // compute once; reused by the two rows below
  return `
    <div class="hero">
      <video src="${mediaUrl(hero.src)}" muted autoplay loop playsinline></video>
      <div class="hero-body">
        <span class="tag">HOUSE ORIGINAL</span>
        <h1>${esc(hero.title)}</h1>
        <p class="sub">${esc(creatorName(hero.creator))} • ${fmt(hero.views)} views</p>
        <button class="btn" onclick="openVideo(${hero.id})">▶ Play</button>
        <button class="btn ghost" onclick="toggleLater(${hero.id})">+ Watch Later</button>
      </div>
    </div>
    ${vstate.history.length ? rowSection("Continue Watching", vstate.history.map(id=>DATA.videos.find(v=>v.id===id)).filter(Boolean)) : ""}
    ${rowSection("Recommended For You", top.slice(0,6))}
    ${rowSection("Trending Now", top.slice(0,6))}
    ${rowSection("House Originals", DATA.videos.filter(v=>v.type==="original"))}
    ${DATA.categories.map(c=>rowSection(c, byCat(c))).join("")}
    ${rowSection("Recently Uploaded", [...DATA.videos].sort((a,b)=>b.uploaded.localeCompare(a.uploaded)).slice(0,6))}
  `;
}

function renderWatch(){
  const v = vstate.current || DATA.videos[0];
  if(!v) return `<div class="empty">No video selected.</div>`;
  const c = DATA.creators.find(x=>x.id===v.creator) || { name:"Unknown", id:"", verified:false, subs:0 };
  const subbed = vstate.subs.includes(v.creator);
  const cms = DATA.comments.filter(m=>m.video===v.id);
  const related = trending().filter(u=>u.id!==v.id).slice(0,6);
  const suggestedCard = u=>`
    <div class="card" style="display:flex;gap:10px;margin-bottom:10px;padding:8px" onclick="openVideo(${u.id})">
      <div class="video-thumb ${u.type==='original'?'original':''}" style="width:120px;height:68px;margin:0;flex:none">
        <video class="thumb-video lazy" data-src="${mediaUrl(u.src)}#t=0.1" muted preload="none"></video>
      </div>
      <div><div class="title">${esc(u.title)}</div><div class="meta">${esc(creatorName(u.creator))}</div><div class="small">${fmt(u.views)} views</div></div>
    </div>`;
  return `
    <div class="watch">
      <div>
        ${playerEmbed(v)}
        <h2 class="watch-title">${esc(v.title)}</h2>
        <p class="sub watch-sub" id="watchSub"><span class="ic-eye">👁</span> ${fmt(v.views)} views <span class="dot-sep">•</span> ${esc(v.uploaded)}</p>

        <div class="watch-actions">
          <div class="vote-pill">
            <button id="btnLike" class="vote-btn" onclick="likeVideo(${v.id})"><span class="ic">👍</span> <span id="likeNum">${fmt(v.likes)}</span></button>
            <span class="vote-div"></span>
            <button id="btnDislike" class="vote-btn" onclick="dislikeVideo(${v.id})"><span class="ic">👎</span> <span id="disNum">${v.dislikes}</span></button>
          </div>
          <button id="btnFav" class="act-btn ${vstate.favorites.includes(v.id)?'on':''}" onclick="toggleFav(${v.id})"><span class="ic">♥</span> Favorite</button>
          <button id="btnLater" class="act-btn ${vstate.later.includes(v.id)?'on':''}" onclick="toggleLater(${v.id})"><span class="ic">🔖</span> Save</button>
          <button class="act-btn" onclick="shareVideo(${v.id})"><span class="ic">↗</span> Share</button>
          <button class="act-btn act-more" onclick="toast('Report submitted (simulated)')" title="More" aria-label="More">···</button>
        </div>

        <div class="creator-card">
          <div class="avatar avatar-lg">${esc((c.name||"?")[0])}</div>
          <div style="flex:1;min-width:0">
            <div class="creator-name">${esc(c.name)} ${c.verified?'<span class="verified" title="Verified">✓</span>':''}</div>
            <div class="small">${fmt(c.subs)} subscribers</div>
          </div>
          <button class="btn subscribe-btn ${subbed?'ghost':''}" onclick="subscribe('${esc(c.id)}')">${subbed?'Subscribed':'＋ Subscribe'}</button>
        </div>

        <div class="comments-card">
          <div class="comments-top">
            <div class="comments-title">Comments <span class="count-bubble">${cms.length}</span></div>
            <select class="sort-select" id="cSort" onchange="render()">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
            </select>
          </div>
          <div class="comment-form">
            <div class="avatar avatar-sm">${esc((DATA.user.name||'?')[0])}</div>
            <input class="fld" id="cbox" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')addComment(${v.id})"/>
            <button class="btn" onclick="addComment(${v.id})">Comment</button>
          </div>
          <div class="comment-list">
            ${cms.length
              ? sortComments(cms).map(m=>`<div class="comment"><div class="avatar avatar-sm">${esc((m.user||'?')[0])}</div><div style="flex:1;min-width:0"><div><b>${esc(m.user)}</b> <span class="small">${esc(m.time)}</span></div><div class="comment-text">${esc(m.text)}</div></div></div>`).join("")
              : `<div class="comments-empty"><div class="ce-icon">💬</div><div class="ce-title">No comments yet.</div><div class="small">Be the first to share your thoughts!</div></div>`}
          </div>
        </div>

        <div class="related-below">
          <h3>Related Videos</h3>
          <div class="grid">${related.map(u=>videoCard(u)).join("")}</div>
        </div>
      </div>
      <div class="watch-side">
        <h3 style="margin-top:0">Suggested Videos</h3>
        ${related.map(suggestedCard).join("")}
      </div>
    </div>`;
}

/* Sort comments by the stored time. DB comments use ISO-ish via created_at; the
   merged objects keep a 'time' label, so we sort by id (monotonic) as a proxy:
   db ids increase with time; local 'now' comments use Date.now()-based ids. */
function sortComments(cms){
  const order = (document.getElementById("cSort")||{}).value || "new";
  const key = m => { const s=String(m.id); const n=parseInt(s.replace(/\D/g,""),10); return isNaN(n)?0:n; };
  const sorted = [...cms].sort((a,b)=> key(b)-key(a));   // newest first
  return order==="old" ? sorted.reverse() : sorted;
}
function shareVideo(id){
  const url = location.href.split("#")[0] + "#video/" + id;
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(()=>toast("Link copied"),()=>toast("Link: "+url));
  else toast("Link: "+url);
}

function listPage(title, list, emptyMsg){
  return `<h2>${title}</h2><p class="sub">${list.length} item${list.length!==1?'s':''}</p>
    ${list.length?`<div class="grid">${list.map(v=>videoCard(v)).join("")}</div>`:`<div class="empty">${emptyMsg}</div>`}`;
}

function renderCategories(){
  return `<h2>Categories</h2><p class="sub">Browse by topic</p>
    ${DATA.categories.map(c=>`<h3>${esc(c)}</h3><div class="row-scroll">${byCat(c).map(v=>videoCard(v)).join("")||'<div class="small">No videos yet.</div>'}</div>`).join("")}`;
}
function renderSubs(){
  const list = DATA.videos.filter(v=>vstate.subs.includes(v.creator));
  return `<h2>Subscriptions</h2><p class="sub">Latest from creators you follow</p>
    <div class="pill-row">${DATA.creators.filter(c=>vstate.subs.includes(c.id)).map(c=>`<span class="filter-pill active">${esc(c.name)}</span>`).join("")}</div>
    <div class="grid">${list.map(v=>videoCard(v)).join("")}</div>`;
}
function renderProfile(){
  return `<h2>Your Profile</h2>
    <div class="panel" style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
      <div class="avatar" style="width:60px;height:60px;font-size:24px">A</div>
      <div><h3 style="margin:0">${esc(DATA.user.name)}</h3><div class="small">${esc(DATA.user.handle)} • ${vstate.subs.length} subscriptions</div></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="label">Favorites</div><div class="value">${vstate.favorites.length}</div></div>
      <div class="metric"><div class="label">Watch Later</div><div class="value">${vstate.later.length}</div></div>
      <div class="metric"><div class="label">History</div><div class="value">${vstate.history.length}</div></div>
      <div class="metric"><div class="label">Downloads</div><div class="value">${vstate.downloads.length}</div></div>
    </div>
    <h3>Achievements</h3>
    <div class="pill-row"><span class="filter-pill">🏆 Early Adopter</span><span class="filter-pill">🔥 7-Day Streak</span><span class="filter-pill">⭐ Super Fan</span></div>`;
}
function renderSettings(){
  return `<h2>Settings</h2>
    <div class="panel" style="max-width:520px">
      <label class="lbl">Playback Quality</label>
      <select class="fld"><option>Auto</option><option>1080p</option><option>720p</option><option>480p</option></select>
      <label class="lbl">Autoplay next video</label>
      <select class="fld"><option>On</option><option>Off</option></select>
      <label class="lbl">Language</label>
      <select class="fld"><option>English</option><option>Español</option><option>Français</option></select>
      <label class="lbl">Theme</label>
      <select class="fld"><option>Dark (Red)</option></select>
      <br/><br/><button class="btn" onclick="toast('Settings saved')">Save Changes</button>
    </div>`;
}
function renderLive(){
  return `<h2>Live</h2><p class="sub">Streams happening now</p>
    <div class="grid">${DATA.videos.slice(0,3).map(v=>videoCard(v,{extra:()=>`<div class="card-actions"><span class="chip" style="color:var(--accent2);border-color:var(--accent2)">● LIVE</span><span class="chip">${fmt(v.views)} watching</span></div>`})).join("")}</div>`;
}
function renderPlaylists(){
  return `<h2>Playlists</h2><p class="sub">Your collections</p>
    <div class="grid">
      ${["My Mix","Chill","Tech Deep-Dives"].map((p,i)=>{
        const pv = DATA.videos[i];
        const thumb = pv ? `<video class="thumb-video lazy" data-src="${mediaUrl(pv.src)}#t=0.1" muted preload="none"></video>` : ``;
        return `<div class="card"><div class="video-thumb">${thumb}</div>
        <div class="title">${esc(p)}</div><div class="meta">${(i+2)} videos</div></div>`;
      }).join("")}
    </div>`;
}

function doSearch(){
  const q=(document.getElementById("searchInput").value||"").toLowerCase();
  if(!q){ render(); return; }
  const vids = DATA.videos.filter(v=>v.title.toLowerCase().includes(q));
  const crs  = DATA.creators.filter(c=>c.name.toLowerCase().includes(q));
  document.getElementById("view").innerHTML = `
    <h2>Search: "${esc(q)}"</h2>
    <div class="pill-row"><span class="filter-pill active">All</span><span class="filter-pill">Videos</span><span class="filter-pill">Creators</span><span class="filter-pill">Playlists</span></div>
    <h3>Creators</h3>${crs.length?`<div class="pill-row">${crs.map(c=>`<span class="filter-pill">${esc(c.name)} ${c.verified?'✔️':''}</span>`).join("")}</div>`:'<div class="small">None</div>'}
    <h3>Videos</h3>${vids.length?`<div class="grid">${vids.map(v=>videoCard(v)).join("")}</div>`:'<div class="empty">No videos found.</div>'}`;
  lazyLoadThumbs();
}

function render(){
  const v=document.getElementById("view"); const p=vstate.page;
  const map={
    home:renderHome, watch:renderWatch, categories:renderCategories, subscriptions:renderSubs,
    profile:renderProfile, settings:renderSettings, live:renderLive, playlists:renderPlaylists,
  };
  if(map[p]) v.innerHTML = map[p]();
  else if(p==="explore")   v.innerHTML = listPage("Explore", trending(), "");
  else if(p==="trending")  v.innerHTML = listPage("Trending", trending(), "");
  else if(p==="originals") v.innerHTML = listPage("House Originals", DATA.videos.filter(x=>x.type==="original"), "");
  else if(p==="favorites") v.innerHTML = listPage("Favorites", DATA.videos.filter(x=>vstate.favorites.includes(x.id)), "Tap ★ on any video to save it here.");
  else if(p==="later")     v.innerHTML = listPage("Watch Later", DATA.videos.filter(x=>vstate.later.includes(x.id)), "Nothing saved yet.");
  else if(p==="history")   v.innerHTML = listPage("History", vstate.history.map(id=>DATA.videos.find(x=>x.id===id)).filter(Boolean), "No watch history yet.");
  else if(p==="downloads") v.innerHTML = listPage("Downloads", DATA.videos.filter(x=>vstate.downloads.includes(x.id)), "No downloads yet.");
  else v.innerHTML = renderHome();
  document.querySelectorAll("#nav button, #bottomNav button").forEach(b=>b.classList.toggle("active", b.dataset.page===p));
  lazyLoadThumbs();
  if(_pendingHydrate!=null){ const hid=_pendingHydrate; _pendingHydrate=null; hydrateWatch(hid); }
}

/* Lazy-load video thumbnails: only fetch a thumbnail's metadata once its card
   scrolls near the viewport. Without this, ~180 <video> elements would all
   request metadata from the CDN on load and crawl the page. */
function revealThumb(el){
  if(el.dataset.src){ el.src = el.dataset.src; el.preload = "metadata"; el.removeAttribute("data-src"); }
  el.classList.remove("lazy");
}
/* Asymmetric margin: generous vertical lookahead for the scrolling grid pages,
   tighter horizontal so off-screen cards in `.row-scroll` rows aren't all
   fetched at once on the home feed. */
const _lazyObserver = ("IntersectionObserver" in window)
  ? new IntersectionObserver((entries, obs)=>{
      entries.forEach(e=>{
        if(!e.isIntersecting) return;
        revealThumb(e.target);
        obs.unobserve(e.target);
      });
    }, { rootMargin: "250px 80px" })
  : null;
function lazyLoadThumbs(){
  const els = document.querySelectorAll("video.lazy[data-src]");
  if(_lazyObserver){ els.forEach(el=>_lazyObserver.observe(el)); }
  else { els.forEach(revealThumb); }   // no IntersectionObserver: load eagerly
}
if(location.hash) applyHash();
render();

/* Restore this browser's persisted favorites (per-visitor via client_id), then
   re-render so the favorites page / heart states reflect them. Best-effort. */
(async ()=>{
  if(typeof ShAPI==="undefined" || !ShAPI.enabled) return;
  try {
    const favs = await ShAPI.myFavorites();
    if(favs && favs.length){
      for(const id of favs) if(!vstate.favorites.includes(id)) vstate.favorites.push(id);
      render();
    }
  } catch(_){}
})();
</script>
